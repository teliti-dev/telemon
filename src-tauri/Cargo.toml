[package]
name = "telemon"
version = "0.1.0"
description = "Monitoring PPPoE multi-Mikrotik"
authors = ["Teliti"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "telemon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6" }
tauri-plugin-log = "2"

# Binary kecil: tanpa OpenSSL/aws-lc (pakai rustls + ring bila perlu TLS), tanpa C bawaan selain SQLite statis. ADR 0010.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "telemon-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Inti Telemon: klien dan model RouterOS (tanpa penyimpanan)"

[features]
default = ["tls"]
# TLS api-ssl (port 8729) dengan sertifikat terpasang (pin sidik jari). rustls + ring, tanpa OpenSSL/aws-lc.
tls = ["mikrotik-rs/tokio-tls", "dep:rustls", "dep:tokio-rustls"]

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
hmac = "0.13.0"
mikrotik-rs = "0.10.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"], optional = true }
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-util", "test-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "telemon-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Peluncur aplikasi desktop Telemon: membuka penyimpanan, kredensial, pemantau, dan server loopback untuk webview"

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
telemon-core = { version = "0.1.0", path = "../telemon-core" }
telemon-http = { version = "0.1.0", path = "../telemon-http" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"

[package]
name = "telemon-ext"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Paket extension Telemon: manifest, berkas .tmx, tanda tangan Ed25519 (ADR 0028)"

[[bin]]
name = "tmx"
path = "src/bin/tmx.rs"

[dependencies]
wasmi = { version = "2.0.3", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }
getrandom = "0.3"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
wat = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }

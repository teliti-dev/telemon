[package]
name = "telemon-http"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Server HTTP Telemon: API JSON, login, WebSocket (mode Serve/Publik)"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "query", "matched-path"] }
bytes = "1"
futures-core = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
telemon-ai = { version = "0.1.0", path = "../telemon-ai" }
telemon-core = { version = "0.1.0", path = "../telemon-core" }
telemon-ext = { version = "0.1.0", path = "../telemon-ext" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }

[dev-dependencies]
telemon-ext = { version = "0.1.0", path = "../telemon-ext" }
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[package]
name = "telemon-ai"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "AI chat Telemon: klien LLM, alat baca terotorisasi, dan agen (hanya membaca)"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
telemon-core = { version = "0.1.0", path = "../telemon-core" }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
